<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Datara Engine - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1A3FD4",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#bac3ff",
                        "secondary-container": "rgba(26, 63, 212, 0.1)",
                        "on-secondary-container": "#bac3ff",
                        surface: "#0D1117",
                        "surface-container-highest": "#161B22",
                        "on-surface": "#E6EDF3",
                        "on-surface-variant": "#8B949E",
                        outline: "#30363D",
                        "outline-variant": "#21262D"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Geist", "sans-serif"],
                        display: ["Geist", "sans-serif"],
                        body: ["Geist", "sans-serif"],
                        label: ["Geist", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }
        body {
            background-color: #0D1117;
            color: #E6EDF3;
            font-family: 'Geist', sans-serif;
        }
        .active-nav-border {
            border-left: 3px solid #1A3FD4;
        }
    </style>

<body class="bg-surface">

<span class="text-xs text-on-surface-variant font-label tracking-wide">Data Engine v1.0</span>
</div>
<!-- Primary Navigation -->
<nav class="flex flex-col gap-y-1">

    <a class="bg-secondary-container text-on-secondary-container font-bold rounded-lg px-4 py-2.5 flex items-center gap-3 transition-all duration-200 active:scale-95 active-nav-border group" href="upload.html">

<span class="font-body text-body-md">Upload</span>
</a>
    <a class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest px-4 py-2.5 flex items-center gap-3 rounded-lg transition-all duration-200 active:scale-95 group" href="chat.html">

    <a class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest px-4 py-2.5 flex items-center gap-3 rounded-lg transition-all duration-200 active:scale-95 group" href="dashboard.html">

    <a class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest px-4 py-2.5 flex items-center gap-3 rounded-lg transition-all duration-200 active:scale-95 group" href="settings.html">

<span class="font-body text-body-md">Settings</span>

</div>
</div>

<div class="mt-auto">
<button class="w-full flex items-center justify-center gap-2 px-4 py-3 border border-primary text-primary hover:bg-primary/5 rounded-lg font-bold text-sm transition-all active:scale-95">
